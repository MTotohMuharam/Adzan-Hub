<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dzan-Hub | Panel Admin</title>

    <link rel="icon" type="image/x-icon" href="favicon-m.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
            color: #333;
        }
        .admin-container {
            max-width: 600px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        input[type="text"], textarea, input[type="number"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background-color: #e67e22; border: none; color: white;
            font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer;
        }
        button:hover { background-color: #d35400; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>PENGATURAN DISPLAY MASJID</h2>
        
        <form id="admin-form">
            <div class="form-group">
                <label>Nama Masjid / Mushola:</label>
                <input type="text" id="namaMasjid" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
            </div>

            <div class="form-group">
                <label>Teks Berjalan (Running Text):</label>
                <textarea id="runningText" rows="4" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc; font-family:sans-serif;"></textarea>
            </div>

            <div class="form-group">
                <label>Jeda Waktu Iqomah (Menit):</label>
                <input type="number" id="jedaIqomah" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
            </div>

            <div class="form-group">
                <label>Nama Event / Agenda:</label>
                <input type="text" id="namaEvent" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
            </div>

            <div class="form-group">
                <label>Tanggal Event:</label>
                <input type="date" id="tanggalEvent" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
            </div>

            <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">
            <h3 style="margin-bottom: 15px; color: #333;">Informasi Kajian & Khotib</h3>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">Jadwal / Informasi Kajian:</label>
                <input type="text" id="infoKajian" placeholder="Contoh: Setiap Sabtu Ba'da Maghrib - Kitab Riyadhus Shalihin" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">Nama Khotib Jumat Ini:</label>
                <input type="text" id="infoKhotib" placeholder="Contoh: Ustadz Dr. H. Ahmad Fauzi, M.A." style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
            </div>

            <button type="submit">Simpan Perubahan</button>
        </form>
                <a href="index.html" class="back-link">← Kembali ke Tampilan Utama TV</a>
    </div>

    <script src="app.js"></script>
</body>
</html>
</body>
</html>
